<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dodenwassing Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Figtree:wght@400;500;600&family=Amiri&display=swap">
<style>
:root{color-scheme:light;--bg:#f2ebdd;--surface:#fffaf1;--ink:#163b2d;--muted:#657168;--line:#e2d5bc;--accent:#164733;--accent-soft:#e9f0e5;--ok:#207550;--ok-soft:#e1f2e6;--bad:#a24b40;--bad-soft:#fae8e5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#fff9ee 0%,#f2ebdd 60%,#e9dfc9 100%);color:var(--ink);font:16px/1.6 Figtree,system-ui,sans-serif;padding:24px 16px 60px}.wrap{max-width:700px;margin:auto;display:flex;flex-direction:column;gap:22px}header{position:relative;isolation:isolate;text-align:center;padding:45px 20px 30px;border:1px solid #dac49a;border-radius:160px 160px 26px 26px;background:linear-gradient(150deg,#fff8e9,#efe5d2);box-shadow:0 15px 45px #705b3220;overflow:hidden}header:before,header:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1}header:before{background-image:repeating-conic-gradient(from 45deg,#ba9b5950 0deg 5deg,transparent 5deg 45deg);background-size:44px 44px;mask-image:linear-gradient(to bottom,#0007,transparent 40%);opacity:.35}header:after{border:2px solid #c7a46e80;border-radius:inherit;inset:8px}.ar{font:2rem Amiri,serif;color:#ad8747}.ar:before{content:"☪";display:block;font:2.7rem Georgia;color:#bd995a;line-height:1.2;margin-bottom:4px}h1{font:700 clamp(2.2rem,7vw,3.5rem)/1.15 Literata,Georgia,serif;margin:2px auto 12px;max-width:530px}.sub{color:#566559;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700;margin:0}.ornament{height:15px;margin:15px auto;max-width:280px;position:relative;border-bottom:1px solid #b99250}.ornament:after{content:"✥";position:absolute;left:50%;top:1px;transform:translateX(-50%);padding:0 12px;background:#f3ead9;color:#af8647}.bar{display:flex;align-items:center;gap:16px;color:var(--ink);font-size:.86rem;font-weight:700;padding:0 6px}.track{height:9px;border-radius:99px;background:#e3d9c5;overflow:hidden;flex:1}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#184a33,#67966d);transition:width .25s}.card{background:#fffaf2ed;border:1px solid #e6d4b4;border-radius:30px;padding:clamp(20px,5vw,36px);box-shadow:0 18px 55px #6f56331a;display:flex;flex-direction:column;gap:22px;backdrop-filter:blur(9px)}.topic{display:inline-flex;align-self:flex-start;padding:5px 13px;background:#e9efdf;border-radius:99px;color:#31593c;letter-spacing:.12em;text-transform:uppercase;font-size:.7rem;font-weight:800}.q{font:500 clamp(1.23rem,4vw,1.6rem)/1.55 Literata,Georgia,serif;color:#182b24;margin:0}.opts{display:grid;gap:13px}.opt{appearance:none;display:flex;gap:15px;align-items:center;width:100%;padding:13px 17px;border-radius:17px;border:1.5px solid #dfcfb3;background:#fffcf7;text-align:left;color:#253629;font:inherit;cursor:pointer;box-shadow:0 4px 12px #7b69430a;transition:transform .15s,border-color .15s,background .15s}.opt:not(:disabled):hover{border-color:#21573d;transform:translateY(-1px)}.opt:focus-visible,.btn:focus-visible{outline:3px solid #c4a261;outline-offset:3px}.opt .l{display:grid;place-items:center;flex:0 0 38px;height:38px;background:#eadeca;color:#194b35;border-radius:50%;font:700 1.05rem Georgia}.opt.ok{border-color:#1c6a42;background:#e6f1e7}.opt.bad{border-color:#a24b40;background:#fae8e5}.opt[disabled]{cursor:default}.fb{border-radius:17px;padding:19px;background:#e8eee5;display:flex;flex-direction:column;gap:10px}.fb strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}.fb p{margin:0}.src{border-top:1px solid #cbd7c8;padding-top:10px;font-size:.86rem;color:#53695c}.src a{color:#185a3e}.btn{appearance:none;border:0;cursor:pointer;border-radius:15px;padding:14px 22px;background:linear-gradient(115deg,#164732,#275e42);color:white;font:700 .9rem Figtree,sans-serif;letter-spacing:.04em;box-shadow:0 6px 14px #18432d29}.btn.ghost{background:#fffcf5;color:#204d35;border:1px solid #d1b88b;box-shadow:none}.score{font:700 3.5rem Literata,serif;margin:0}.review{padding:0;margin:0;list-style:none;display:grid;gap:10px}.review li{padding:13px;border-radius:12px;background:#eee9db;display:grid;gap:5px;font-size:.9rem}.note{text-align:center;font-size:.78rem;color:#6e756e;max-width:520px;margin:0 auto}@media(max-width:420px){body{padding:12px 10px 30px}header{padding:38px 10px 25px}.card{border-radius:24px}.opt{padding:12px 10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.name-field{width:100%;padding:14px 16px;border:1px solid #d1b88b;border-radius:12px;font:inherit}.notice{font-size:.85rem;color:var(--muted);margin:0}.error{color:var(--bad);font-weight:600}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>


<div class="wrap">
  <header>
    <div class="ar" lang="ar" dir="rtl">غسل الميت</div>
    <h1>Dodenwassing Quiz</h1><div class="ornament" aria-hidden="true"></div><p class="sub">Dodenwassing</p>
    <p class="sub">15 vragen · met uitleg en bron bij elk antwoord</p>
  </header>
  <div class="bar"><div class="track"><div class="fill" id="fill"></div></div><span id="count">1 / 15</span></div>
  <main id="app"></main>
  <p class="note">Controleer bij twijfel altijd bij je docent. Hadithnummers volgen de nummering van sunnah.com.</p>
</div>

<script src="questions.js"></script>
<script>
const DB_URL="https://hdkedpllbysexxvdrylr.supabase.co";
const DB_KEY="sb_publishable_koqOekGgrCDZJobuvdd-1Q_yAGvVHWX";
const db=window.supabase?.createClient(DB_URL,DB_KEY);
let participantName="",details=[];
const L="ABCD";let i=0,score=0,answers=[],order=[];
const app=document.getElementById("app");
function shuffle(n){const a=[...Array(n).keys()];for(let k=n-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function prog(){document.getElementById("fill").style.width=(i/Q.length*100)+"%";document.getElementById("count").textContent=Math.min(i+1,Q.length)+" / "+Q.length}
function render(){
  prog();const d=Q[i];order=shuffle(d.o.length);
  app.innerHTML=`<section class="card"><span class="topic">${d.t}</span><h2 class="q">${d.q}</h2>
  <div class="opts">${order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="l">${L[k]}</span><span>${d.o[oi]}</span></button>`).join("")}</div><div id="after"></div></section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.oi));
}
function pick(oi){
  const d=Q[i],good=oi===d.a;if(good)score++;answers.push(good);details.push({question:i+1,selected:oi,correct:d.a,is_correct:good});
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.oi;if(v===d.a)b.classList.add("ok");else if(v===oi)b.classList.add("bad")});
  const src=d.u?`<a href="${d.u}" target="_blank" rel="noopener">${d.s}</a>`:d.s;
  document.getElementById("after").outerHTML=`<div class="fb ${good?"ok":"bad"}"><strong>${good?"Goed!":"Helaas, niet juist"}</strong><p>${d.e}</p><div class="src">Bron: ${src}</div>${d.m?`<div class="src"><b>Meningsverschil:</b> ${d.m}</div>`:""}</div>
  <button class="btn" id="next">${i<Q.length-1?"Volgende vraag":"Bekijk uitslag"}</button>`;
  const n=document.getElementById("next");n.focus();n.onclick=()=>{i++;i<Q.length?render():end()};
}
async function end(){
  document.getElementById("fill").style.width="100%";document.getElementById("count").textContent="Klaar";
  const pct=Math.round(score/Q.length*100);
  const msg=pct>=80?"Uitstekend, je kent de stof goed.":pct>=60?"Goed bezig. Herhaal de vragen die fout gingen.":"Neem de stof nog eens door en probeer opnieuw.";
  app.innerHTML=`<section class="card"><span class="topic">Uitslag</span><p class="score">${score} / ${Q.length}</p><p style="margin:0">${msg}</p>
  <ul class="review">${Q.map((d,k)=>`<li><span class="mark" style="color:var(${answers[k]?"--ok":"--bad"})">${answers[k]?"✓":"✗"} Vraag ${k+1}</span><span>${d.q}</span><span style="color:var(--muted)">Antwoord: ${d.o[d.a]}</span></li>`).join("")}</ul>
  <button class="btn" id="again">Opnieuw beginnen</button></section>`;
  const status=document.createElement("p");status.className="notice";status.textContent="Resultaat opslaan…";app.querySelector(".card").insertBefore(status,document.getElementById("again"));
  if(!db){status.textContent="Opslaan is niet beschikbaar. Meld dit aan de organisator."}
  else {try{const {error}=await db.from("quiz_submissions").insert({participant_name:participantName,score,answers:details});if(error)throw error;status.textContent="Je resultaat is opgeslagen."}catch(e){console.error(e);status.textContent="Opslaan mislukt. Maak een screenshot van je uitslag en meld dit aan de organisator.";status.classList.add("error")}}
  document.getElementById("again").onclick=()=>{i=0;score=0;answers=[];details=[];render();window.scrollTo(0,0)};
}
function startScreen(){document.getElementById("fill").style.width="0%";document.getElementById("count").textContent="Start";app.innerHTML=`<form class="card" id="startForm"><span class="topic">Welkom</span><h2 class="q">Vul je naam in om de Dodenwassing Quiz te beginnen</h2><label for="participant">Je naam</label><input class="name-field" id="participant" name="participant" minlength="2" maxlength="100" autocomplete="name" required placeholder="Voor- en achternaam"><p class="notice">Je naam en antwoorden worden opgeslagen voor analyse door de beheerders. Alleen beheerders kunnen de resultaten inzien.</p><button class="btn" type="submit">Start de quiz</button></form>`;document.getElementById("startForm").onsubmit=e=>{e.preventDefault();const name=document.getElementById("participant").value.trim();if(name.length<2)return;participantName=name;i=0;score=0;answers=[];details=[];render()}}
startScreen();
</script>

</body>
</html>
