<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dodenwassing Quiz · Beheer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{font:16px/1.5 system-ui,sans-serif;background:#f2ebdd;color:#163b2d;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}h1,h2{font-family:Georgia,serif}.panel{background:#fffaf1;border:1px solid #e2d5bc;border-radius:18px;padding:22px;margin:18px 0}input,button{font:inherit;padding:12px;border-radius:10px;margin:5px}input{border:1px solid #cdbb9c;max-width:100%}button{border:0;background:#164733;color:white;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left} .scroll{overflow-x:auto}.muted{color:#657168}.bad{color:#a24b40}.good{color:#207550}.bar{background:#e6d9c3;border-radius:12px;overflow:hidden;height:12px;min-width:100px}.bar span{display:block;background:#207550;height:100%}details{padding:6px 0}#dashboard[hidden],#login[hidden]{display:none}</style></head><body><div class="wrap"><h1>Dodenwassing Quiz</h1><p>Privé beheerdersdashboard</p><section id="login" class="panel"><h2>Inloggen als beheerder</h2><form id="loginForm"><input type="email" id="email" placeholder="E-mailadres" required autocomplete="email"><input type="password" id="password" placeholder="Wachtwoord" required autocomplete="current-password"><button>Inloggen</button></form><p id="loginMessage" class="bad" role="status"></p></section><section id="dashboard" hidden><button id="logout">Uitloggen</button><div class="panel"><h2>Overzicht</h2><div id="summary"></div><button id="refresh">Vernieuwen</button><button id="export">Download CSV (Excel)</button></div><div class="panel"><h2>Analyse per vraag</h2><div class="scroll"><table><thead><tr><th>Vraag</th><th>Goed</th><th>Fout</th><th>Percentage goed</th></tr></thead><tbody id="analysis"></tbody></table></div></div><div class="panel"><h2>Resultaten per deelnemer</h2><div class="scroll"><table><thead><tr><th>Naam</th><th>Datum</th><th>Score</th><th>Antwoorden</th></tr></thead><tbody id="participants"></tbody></table></div></div></section></div><script>
const client=supabase.createClient("https://hdkedpllbysexxvdrylr.supabase.co","sb_publishable_koqOekGgrCDZJobuvdd-1Q_yAGvVHWX");
let rows=[];const $=id=>document.getElementById(id);
function cell(tr,value){const td=document.createElement("td");td.textContent=String(value);tr.append(td);return td}
async function check(){const {data:{user}}=await client.auth.getUser();if(!user){$("login").hidden=false;$("dashboard").hidden=true;return}const {data,error}=await client.from("quiz_admins").select("user_id").eq("user_id",user.id).maybeSingle();if(error||!data){$("loginMessage").textContent="Dit account heeft geen beheerdersrechten.";$("login").hidden=false;$("dashboard").hidden=true;return}$("login").hidden=true;$("dashboard").hidden=false;await load()}
async function load(){const {data,error}=await client.from("quiz_submissions").select("participant_name,created_at,score,answers").order("created_at",{ascending:false}).limit(1000);if(error){alert("Resultaten ophalen mislukt: "+error.message);return}rows=data||[];const total=rows.length;const avg=total?(rows.reduce((s,r)=>s+r.score,0)/total).toFixed(1):"0";$("summary").textContent=total+" deelnemers · gemiddelde score "+avg+" / 15 (maximaal 1000 recente inzendingen)";$("analysis").replaceChildren();for(let q=1;q<=15;q++){let good=0,bad=0;for(const r of rows){const a=(r.answers||[]).find(x=>x.question===q);if(a){if(a.is_correct)good++;else bad++}}const tr=document.createElement("tr");cell(tr,q);cell(tr,good);cell(tr,bad);const td=cell(tr,(good+bad?Math.round(good/(good+bad)*100):0)+"%");$("analysis").append(tr)}$("participants").replaceChildren();for(const r of rows){const tr=document.createElement("tr");cell(tr,r.participant_name);cell(tr,new Date(r.created_at).toLocaleString("nl-NL"));cell(tr,r.score+" / 15");const td=document.createElement("td");const det=document.createElement("details");const sum=document.createElement("summary");sum.textContent="Bekijk antwoorden";det.append(sum);for(const a of r.answers||[]){const p=document.createElement("p");p.className=a.is_correct?"good":"bad";p.textContent="Vraag "+a.question+": "+(a.is_correct?"goed":"fout")+" · gekozen optie "+(a.selected+1)+" · juiste optie "+(a.correct+1);det.append(p)}td.append(det);tr.append(td);$("participants").append(tr)}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMessage").textContent="Inloggen…";const {error}=await client.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("loginMessage").textContent=error.message;return}$("loginMessage").textContent="";await check()};
$("logout").onclick=async()=>{await client.auth.signOut();await check()};$("refresh").onclick=load;
$("export").onclick=()=>{const lines=[["Naam","Datum","Score","Vraag","Gekozen optie","Juiste optie","Goed"]];for(const r of rows)for(const a of r.answers||[])lines.push([r.participant_name,r.created_at,r.score,a.question,a.selected+1,a.correct+1,a.is_correct?"Ja":"Nee"]);const csv="\ufeff"+lines.map(line=>line.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const link=document.createElement("a");link.href=url;link.download="dodenwassing-quiz-resultaten.csv";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
check();
</script></body></html>
